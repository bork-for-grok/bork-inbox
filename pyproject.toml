[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bork-inbox"
version = "0.1.0"
description = "A small self-hosted MCP inbox server so bots can pass tasks and replies to each other."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Bork for Grok contributors" }]
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bork-inbox = "bork_inbox.server:main"

[project.urls]
Homepage = "https://github.com/bork-for-grok/bork-inbox"

[tool.setuptools]
packages = ["bork_inbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
